<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>赛博占卜 - 六爻排盘</title>
<style>
:root {
  --bg: #f5f5f0;
  --card: #fff;
  --text: #333;
  --text-dim: #888;
  --border: #e0e0d8;
  --gold: #c4956a;
  --gold-light: #e8d5c4;
  --red: #c45c4a;
  --green: #5a8f5a;
  --blue: #4a7ab0;
  --brown: #8b7355;
  --purple: #7a5a9a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
}

.header {
  background: linear-gradient(135deg, #2c1810 0%, #4a2c1a 100%);
  color: var(--gold-light);
  padding: 16px 20px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
}
.header h1 {
  font-family: "STSong", "SimSun", serif;
  font-size: 22px;
  letter-spacing: 6px;
  font-weight: normal;
  color: var(--gold);
}
.header .btn-settings {
  position: absolute;
  right: 16px;
  background: none;
  border: 1px solid rgba(232,213,196,0.3);
  color: var(--gold-light);
  width: 32px; height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
}

/* 设置面板 */
.settings-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.settings-overlay.show { display: flex; }
.settings-panel {
  background: #fff;
  border-radius: 16px;
  padding: 24px;
  width: 90%;
  max-width: 400px;
}
.settings-panel h3 { font-size: 18px; margin-bottom: 16px; color: #2c1810; }
.settings-panel label { font-size: 13px; color: var(--text-dim); display: block; margin-bottom: 6px; }
.settings-panel input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  margin-bottom: 16px;
  outline: none;
  background: #faf8f5;
}
.settings-panel input:focus { border-color: var(--gold); }
.settings-panel .hint { font-size: 11px; color: var(--text-dim); margin-bottom: 16px; line-height: 1.6; }
.settings-panel .btn-row { display: flex; gap: 10px; justify-content: flex-end; }
.settings-panel button {
  padding: 8px 20px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  cursor: pointer;
}
.settings-panel .btn-save {
  background: linear-gradient(135deg, #4a2c1a, #2c1810);
  color: var(--gold);
}
.settings-panel .btn-cancel {
  background: #f0ece4;
  color: var(--text-dim);
}

/* 状态条 */
.status-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 16px;
  font-size: 11px;
  background: #faf8f5;
  border-bottom: 1px solid var(--border);
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; }
.status-online { background: var(--green); }
.status-offline { background: var(--red); }

/* 主容器 */
.container { max-width: 600px; margin: 0 auto; padding: 12px; }

.card {
  background: var(--card);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.card-header {
  padding: 10px 16px;
  background: linear-gradient(90deg, #faf8f5, #f0ece4);
  font-size: 13px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card-body { padding: 12px 16px; }

.datetime-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 6px; }
.datetime-main { font-size: 16px; font-weight: 500; }
.datetime-label { font-size: 12px; color: var(--text-dim); }
.jieqi-info { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

.sizhu-row { display: flex; justify-content: center; gap: 16px; padding: 8px 0; }
.sizhu-item { text-align: center; }
.sizhu-label { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
.sizhu-value { font-size: 20px; font-family: "STSong", serif; font-weight: 600; }
.gan-jia { color: var(--green); }
.gan-yi { color: var(--green); }
.gan-bing { color: var(--red); }
.gan-ding { color: var(--red); }
.gan-wu { color: var(--brown); }
.gan-ji { color: var(--brown); }
.gan-geng { color: var(--gold); }
.gan-xin { color: var(--gold); }
.gan-ren { color: var(--blue); }
.gan-gui { color: var(--blue); }

.shensha-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-size: 12px; }
.shensha-item { display: flex; justify-content: space-between; padding: 4px 6px; background: #faf8f5; border-radius: 4px; }
.shensha-name { color: var(--text-dim); }
.shensha-value { font-weight: 500; color: var(--red); }

.yuejian-row { display: flex; justify-content: space-around; font-size: 14px; padding: 8px 0; }
.yuejian-item { text-align: center; }
.yuejian-item .label { font-size: 11px; color: var(--text-dim); }
.yuejian-item .value { font-size: 16px; font-weight: 500; color: var(--red); }

.gua-header { display: flex; justify-content: space-around; align-items: center; padding: 16px; background: linear-gradient(135deg, #faf8f5, #f0ece4); }
.gua-main { text-align: center; }
.gua-name { font-size: 22px; font-family: "STSong", serif; font-weight: 600; color: #2c1810; }
.gua-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.gua-arrow { font-size: 24px; color: var(--gold); }
.gua-bian .gua-name { color: var(--text-dim); }

.yao-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.yao-table th { font-size: 11px; color: var(--text-dim); font-weight: normal; padding: 6px 4px; background: #faf8f5; border-bottom: 1px solid var(--border); }
.yao-table td { padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--border); vertical-align: middle; }
.yao-table tr:last-child td { border-bottom: none; }

.ls-qinglong { color: var(--green); }
.ls-zhuque { color: var(--red); }
.ls-gouchen { color: var(--brown); }
.ls-tengshe { color: #9966cc; }
.ls-baihu { color: #aaa; }
.ls-xuanwu { color: var(--blue); }

.liuqin { font-weight: 500; }
.zhi-item { display: inline-flex; flex-direction: column; align-items: center; }
.zhi-gan { font-size: 10px; color: var(--text-dim); }
.zhi-name { font-size: 16px; font-weight: 500; }

.wx-jin { color: #aaa; }
.wx-mu { color: var(--green); }
.wx-shui { color: var(--blue); }
.wx-huo { color: var(--red); }
.wx-tu { color: var(--brown); }

.yao-graphic { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 36px; }
.yang-yao { width: 40px; height: 6px; background: #2c1810; border-radius: 2px; }
.yin-yao { display: flex; gap: 4px; }
.yin-yao span { width: 16px; height: 6px; background: #2c1810; border-radius: 2px; }
.yao-changing .yang-yao, .yao-changing .yin-yao span { background: var(--red); box-shadow: 0 0 4px rgba(196,90,74,0.4); }

.shiying-mark { display: inline-block; font-size: 10px; padding: 1px 4px; border-radius: 3px; margin-left: 2px; }
.mark-shi { background: var(--red); color: #fff; }
.mark-ying { background: var(--blue); color: #fff; }

.question-bar { padding: 12px 16px; font-size: 14px; color: var(--text-dim); border-top: 1px solid var(--border); }
.question-bar strong { color: var(--text); }

.reading-card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); line-height: 1.8; }
.reading-card h3 { font-size: 15px; color: var(--gold); margin-bottom: 10px; font-weight: 600; }
.reading-card blockquote { border-left: 3px solid var(--gold); margin: 10px 0; padding: 8px 12px; background: #faf8f5; border-radius: 0 8px 8px 0; font-family: "STKaiti", "KaiTi", serif; color: #5a4a3a; }
.reading-card blockquote cite { display: block; text-align: right; font-size: 12px; color: var(--text-dim); margin-top: 4px; font-style: normal; }
.reading-card strong { color: var(--gold); }

.reasoning-chain { margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.reasoning-header { padding: 10px 14px; background: #faf8f5; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-dim); }
.reasoning-body { padding: 12px 14px; display: none; font-size: 13px; color: var(--text-dim); line-height: 1.8; }
.reasoning-body.open { display: block; }

.input-container { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); padding: 10px 16px 16px; z-index: 100; }
.input-wrapper { max-width: 600px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
.input-wrapper textarea { flex: 1; background: #f5f5f0; border: 1px solid var(--border); border-radius: 20px; padding: 10px 16px; color: var(--text); font-size: 15px; resize: none; outline: none; font-family: inherit; line-height: 1.5; max-height: 100px; }
.input-wrapper textarea:focus { border-color: var(--gold); }
.btn-send { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #4a2c1a, #2c1810); color: var(--gold); border: none; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

.loading-box { text-align: center; padding: 40px; color: var(--text-dim); }
.loading-box .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

.welcome { text-align: center; padding: 40px 20px; color: var(--text-dim); }
.welcome h2 { font-family: "STSong", serif; color: var(--gold); font-size: 20px; margin-bottom: 10px; letter-spacing: 4px; }

.setup-banner { background: #fff3cd; border: 1px solid #ffc107; border-radius: 10px; padding: 14px 16px; margin: 12px; font-size: 13px; color: #664d03; text-align: center; line-height: 1.6; }
.setup-banner a { color: #0d6efd; cursor: pointer; text-decoration: underline; }

@media (max-width: 480px) {
  .sizhu-row { gap: 10px; }
  .sizhu-value { font-size: 18px; }
  .yao-table { font-size: 12px; }
  .yang-yao { width: 32px; }
  .yin-yao span { width: 12px; }
  .shensha-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<div class="header">
  <h1>赛 博 占 卜</h1>
  <button class="btn-settings" onclick="toggleSettings()" title="设置后端地址">⚙</button>
</div>

<!-- 状态条 -->
<div id="statusBar" class="status-bar">
  <span class="status-dot" id="statusDot"></span>
  <span id="statusText">检查连接...</span>
</div>

<!-- 设置面板 -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <h3>🔗 后端地址设置</h3>
    <label>API 地址</label>
    <input type="text" id="apiUrlInput" placeholder="例如 https://xxx.onrender.com">
    <div class="hint">
      💡 部署指南：<br>
      1. 将后端部署到 <b>Render.com</b>（免费）<br>
      2. 获得地址如 <code>https://赛博占卜.onrender.com</code><br>
      3. 填入上方并保存
    </div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="toggleSettings()">取消</button>
      <button class="btn-save" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<div class="container" id="mainContainer">
  <div class="welcome" id="welcome">
    <h2>六爻排盘</h2>
    <p>输入你想问的事，AI 起卦排盘<br>结合古籍给出解读</p>
  </div>
</div>

<div class="input-container">
  <div class="input-wrapper">
    <textarea id="userInput" rows="1" placeholder="说说你最近在想的事..."
      onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
    <button class="btn-send" id="btnSend" onclick="sendMessage()" disabled>占</button>
  </div>
</div>

<script>
// API 地址——优先 localStorage，否则使用默认 Render 后端
let API_BASE = localStorage.getItem('cyber_div_api') || 'https://cyber-divination.onrender.com';
const container = document.getElementById('mainContainer');
const userInput = document.getElementById('userInput');
const btnSend = document.getElementById('btnSend');
let isLoading = false;

// 检查连接
async function checkConnection() {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  try {
    const resp = await fetch(`${API_BASE}/api/health`, { signal: AbortSignal.timeout(3000) });
    if (resp.ok) {
      dot.className = 'status-dot status-online';
      text.textContent = '后端已连接';
      return true;
    }
  } catch (e) {}
  dot.className = 'status-dot status-offline';
  text.textContent = API_BASE ? '后端无法连接' : '未配置后端 — 点击 ⚙ 设置';
  return false;
}

// 设置面板
function toggleSettings() {
  const overlay = document.getElementById('settingsOverlay');
  const input = document.getElementById('apiUrlInput');
  input.value = API_BASE;
  overlay.classList.toggle('show');
}

function saveSettings() {
  const url = document.getElementById('apiUrlInput').value.trim().replace(/\/$/, '');
  API_BASE = url;
  localStorage.setItem('cyber_div_api', url);
  document.getElementById('settingsOverlay').classList.remove('show');
  checkConnection();
}

// 显示设置提示
function showSetupBanner() {
  const existing = document.getElementById('setupBanner');
  if (existing) return;
  const banner = document.createElement('div');
  banner.id = 'setupBanner';
  banner.className = 'setup-banner';
  banner.innerHTML = '⚠️ 尚未配置后端地址，请点击右上角 <b>⚙</b> 设置<br><a onclick="toggleSettings()">点击此处设置</a>';
  container.insertBefore(banner, container.firstChild);
}

userInput.addEventListener('input', () => {
  btnSend.disabled = !userInput.value.trim() || isLoading;
});

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isLoading) return;

  if (!API_BASE) {
    showSetupBanner();
    toggleSettings();
    return;
  }

  userInput.value = '';
  userInput.style.height = 'auto';
  btnSend.disabled = true;
  isLoading = true;

  const welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';

  const banner = document.getElementById('setupBanner');
  if (banner) banner.remove();

  const loadingId = 'loading-' + Date.now();
  const loadingDiv = document.createElement('div');
  loadingDiv.id = loadingId;
  loadingDiv.innerHTML = `<div class="loading-box"><div class="spinner"></div><p>正在起卦排盘...</p></div>`;
  container.appendChild(loadingDiv);
  scrollToBottom();

  try {
    const resp = await fetch(`${API_BASE}/api/divination`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text }),
    });
    if (!resp.ok) throw new Error(`服务器错误: ${resp.status}`);
    const data = await resp.json();
    document.getElementById(loadingId).remove();
    renderPan(data);
  } catch (err) {
    document.getElementById(loadingId).remove();
    const errDiv = document.createElement('div');
    errDiv.className = 'reading-card';
    errDiv.innerHTML = `<p style="color:var(--red)">连接失败: ${err.message}<br><small>请检查后端地址设置</small></p>`;
    container.appendChild(errDiv);
  }

  isLoading = false;
  btnSend.disabled = !userInput.value.trim();
  scrollToBottom();
}

function renderPan(data) {
  const pan = data.pan;
  const gua = pan.gua;

  const ganClass = (gan) => {
    const map = {'甲':'gan-jia','乙':'gan-yi','丙':'gan-bing','丁':'gan-ding','戊':'gan-wu','己':'gan-ji','庚':'gan-geng','辛':'gan-xin','壬':'gan-ren','癸':'gan-gui'};
    return map[gan] || '';
  };
  const lsClass = (ls) => {
    const map = {'青龙':'ls-qinglong','朱雀':'ls-zhuque','勾陈':'ls-gouchen','腾蛇':'ls-tengshe','白虎':'ls-baihu','玄武':'ls-xuanwu'};
    return map[ls] || '';
  };
  const wxClass = (wx) => {
    const map = {'金':'wx-jin','木':'wx-mu','水':'wx-shui','火':'wx-huo','土':'wx-tu'};
    return map[wx] || '';
  };
  const zhiWx = {'子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火','午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水'};

  const lunarStr = pan.datetime.lunar;

  const renderSizhu = (gz) => `<span class="${ganClass(gz[0])}">${gz[0]}</span><span class="${ganClass(gz[1])}">${gz[1]}</span>`;

  const ss = pan.shensha;
  const shenshaItems = [
    {k:'文昌',v:ss.文昌},{k:'驿马',v:ss.驿马},{k:'将星',v:ss.将星},{k:'桃花',v:ss.桃花},
    {k:'天喜',v:ss.天喜},{k:'天医',v:ss.天医},{k:'谋星',v:ss.谋星},{k:'华盖',v:ss.华盖},
    {k:'灾煞',v:ss.灾煞},{k:'劫煞',v:ss.劫煞},{k:'禄神',v:ss.禄神},{k:'阳刃',v:ss.阳刃},
  ];

  const yaoRows = [...pan.lines].reverse().map(line => {
    const isChange = line.changing;
    const shi = line.is_shi ? '<span class="shiying-mark mark-shi">世</span>' : '';
    const ying = line.is_ying ? '<span class="shiying-mark mark-ying">应</span>' : '';
    const changeMark = isChange ? ' yao-changing' : '';
    const yaoHtml = line.value === 1
      ? `<div class="yang-yao"></div>`
      : `<div class="yin-yao"><span></span><span></span></div>`;
    return `<tr>
      <td class="${lsClass(line.liushen)}">${line.liushen}</td>
      <td class="liuqin">${line.liuqin}</td>
      <td><div class="zhi-item"><span class="zhi-gan ${ganClass(line.gan)}">${line.gan}</span><span class="zhi-name ${wxClass(zhiWx[line.zhi])}">${line.zhi}</span></div></td>
      <td class="${wxClass(zhiWx[line.zhi])}">${zhiWx[line.zhi]}</td>
      <td><div class="yao-graphic${changeMark}">${yaoHtml}</div></td>
      <td>${shi}${ying}</td>
    </tr>`;
  }).join('');

  const benGuaName = gua.ben.name;
  const bianGuaName = gua.bian ? gua.bian.name : null;

  const html = `
    <div class="card">
      <div class="card-header"><span>起卦时间</span><span>${pan.datetime.solar}</span></div>
      <div class="card-body">
        <div class="datetime-row"><span class="datetime-main">${pan.datetime.solar}</span><span class="datetime-label">${lunarStr}</span></div>
        <div class="jieqi-info">${pan.jieqi.current} | 月建：${pan.yuejian} | 日空：${pan.xunkong.day} / 时空：${pan.xunkong.hour}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span>四柱八字</span></div>
      <div class="card-body">
        <div class="sizhu-row">
          <div class="sizhu-item"><div class="sizhu-label">年柱</div><div class="sizhu-value">${renderSizhu(pan.sizhu.year)}</div></div>
          <div class="sizhu-item"><div class="sizhu-label">月柱</div><div class="sizhu-value">${renderSizhu(pan.sizhu.month)}</div></div>
          <div class="sizhu-item"><div class="sizhu-label">日柱</div><div class="sizhu-value">${renderSizhu(pan.sizhu.day)}</div></div>
          <div class="sizhu-item"><div class="sizhu-label">时柱</div><div class="sizhu-value">${renderSizhu(pan.sizhu.hour)}</div></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span>神煞</span><span style="font-size:11px">贵人：${ss.贵人}</span></div>
      <div class="card-body"><div class="shensha-grid">${shenshaItems.map(s => `<div class="shensha-item"><span class="shensha-name">${s.k}</span><span class="shensha-value">${s.v}</span></div>`).join('')}</div></div>
    </div>
    <div class="card">
      <div class="gua-header">
        <div class="gua-main"><div class="gua-name">${benGuaName}</div><div class="gua-sub">${gua.ben.palace}宫${gua.ben.palace_wx} | 世${gua.ben.shi_yao}应${gua.ben.ying_yao}</div></div>
        ${bianGuaName ? `<div class="gua-arrow">→</div><div class="gua-main gua-bian"><div class="gua-name">${bianGuaName}</div><div class="gua-sub">变卦</div></div>` : '<div style="color:var(--text-dim);font-size:12px">静卦</div>'}
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span>六爻排盘</span><span style="font-size:11px">动爻：第${gua.dong_yao}爻</span></div>
      <div class="card-body" style="padding:0">
        <table class="yao-table"><thead><tr><th>六神</th><th>六亲</th><th>干支</th><th>五行</th><th>爻象</th><th>世应</th></tr></thead><tbody>${yaoRows}</tbody></table>
      </div>
    </div>
    <div class="card"><div class="question-bar">占事：<strong>${data.question}</strong></div></div>
    <div class="reading-card">
      <h3>🔮 AI 解读</h3>
      <div>${formatReading(data.reading)}</div>
      ${data.sources && data.sources.length ? `
      <div class="reasoning-chain">
        <div class="reasoning-header" onclick="toggleReasoning(this)"><span>📖 查看推理依据</span><span>▾</span></div>
        <div class="reasoning-body">${data.sources.map(s => `<div style="margin-bottom:10px"><strong style="color:var(--gold)">《${s.book}》</strong><br>${s.text}</div>`).join('')}</div>
      </div>` : ''}
    </div>
  `;

  const div = document.createElement('div');
  div.innerHTML = html;
  container.appendChild(div);
  scrollToBottom();
}

function formatReading(text) {
  text = text.replace(/「([^」]+)」——[《]([^》]+)[》]/g, '<blockquote>「$1」<cite>——《$2》</cite></blockquote>');
  text = text.replace(/【(.+?)】/g, '<strong>【$1】</strong>');
  text = text.replace(/\n/g, '<br>');
  return text;
}

function toggleReasoning(header) {
  const body = header.nextElementSibling;
  const arrow = header.querySelector('span:last-child');
  body.classList.toggle('open');
  arrow.textContent = body.classList.contains('open') ? '▴' : '▾';
}

function scrollToBottom() {
  setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
}

// 初始化
if (!API_BASE) showSetupBanner();
checkConnection();
userInput.focus();
</script>

</body>
</html>
