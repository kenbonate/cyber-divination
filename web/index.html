<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛博占卜 - 六爻排盘</title>
<style>
:root {
  --red: #C41E3A;
  --red-dark: #A0182F;
  --red-light: #FFF0F3;
  --bg: #FFFFFF;
  --bg-sidebar: #FAFAFA;
  --text: #333333;
  --text-dim: #999999;
  --text-light: #666666;
  --border: #E8E8E8;
  --border-light: #F0F0F0;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* ========== 左侧边栏 ========== */
.sidebar {
  width: 25%;
  min-width: 220px;
  max-width: 300px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-logo {
  padding: 28px 24px 20px;
  border-bottom: 1px solid var(--border);
}

.sidebar-logo h1 {
  font-family: "STSong", "SimSun", "Noto Serif SC", serif;
  font-size: 22px;
  letter-spacing: 6px;
  color: var(--red);
  font-weight: normal;
  margin-bottom: 4px;
}

.sidebar-logo .subtitle {
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 2px;
}

.sidebar-nav {
  padding: 16px 12px;
  flex: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 16px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.nav-item:hover {
  background: var(--red-light);
  color: var(--red);
}

.nav-item.active {
  background: var(--red);
  color: #fff;
  font-weight: 500;
}

.nav-icon {
  font-size: 20px;
  width: 28px;
  text-align: center;
}

/* ========== 右侧主区域 ========== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* 头部按钮栏 */
.chat-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  align-items: center;
  flex-shrink: 0;
  min-height: 60px;
}

.chat-header .mode-label {
  font-size: 14px;
  color: var(--text-dim);
  margin-right: auto;
}

.btn-action {
  padding: 8px 24px;
  border: 2px solid var(--red);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  letter-spacing: 2px;
}

.btn-zhan {
  background: var(--red);
  color: #fff;
}

.btn-zhan:hover {
  background: var(--red-dark);
}

.btn-zhan:disabled {
  background: #ccc;
  border-color: #ccc;
  cursor: not-allowed;
}

.btn-zhuiwen {
  background: transparent;
  color: var(--red);
}

.btn-zhuiwen:hover {
  background: var(--red-light);
}

.btn-zhuiwen:disabled {
  color: #ccc;
  border-color: #ddd;
  cursor: not-allowed;
}

/* 对话消息区 */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* 欢迎状态 */
.welcome-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  gap: 16px;
  padding: 40px;
}

.welcome-state .welcome-icon {
  font-size: 48px;
  opacity: 0.6;
}

.welcome-state h2 {
  font-family: "STSong", "SimSun", serif;
  font-size: 22px;
  color: var(--text-light);
  letter-spacing: 4px;
  font-weight: normal;
}

.welcome-state p {
  font-size: 14px;
  text-align: center;
  line-height: 1.6;
}

/* 消息气泡 */
.message {
  display: flex;
  flex-direction: column;
  max-width: 85%;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user {
  align-self: flex-end;
}

.message.user .msg-bubble {
  background: var(--red);
  color: #fff;
  border-radius: 16px 16px 4px 16px;
  padding: 12px 18px;
  font-size: 15px;
  line-height: 1.6;
}

.message.bot {
  align-self: flex-start;
}

.message.bot .msg-bubble {
  background: #F5F5F5;
  color: var(--text);
  border-radius: 16px 16px 16px 4px;
  padding: 16px 20px;
  font-size: 14px;
  line-height: 1.8;
  box-shadow: var(--shadow);
  width: 100%;
}

.msg-time {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
  text-align: center;
}

/* 加载动画 */
.loading-msg {
  align-self: flex-start;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  background: #F5F5F5;
  border-radius: 16px;
  box-shadow: var(--shadow);
  animation: fadeIn 0.3s ease;
}

.loading-dots {
  display: flex;
  gap: 4px;
}

.loading-dots span {
  width: 8px;
  height: 8px;
  background: var(--red);
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out both;
}

.loading-dots span:nth-child(1) { animation-delay: -0.32s; }
.loading-dots span:nth-child(2) { animation-delay: -0.16s; }
.loading-dots span:nth-child(3) { animation-delay: 0s; }

@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

.loading-text {
  font-size: 14px;
  color: var(--text-dim);
}

/* ========== 可视化排盘卡片 ========== */
.paipan-card {
  background: #FFFCF8;
  border-radius: 10px;
  margin: 6px 0 14px;
  border: 1px solid #F0E4D4;
  overflow: hidden;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  box-shadow: 0 1px 4px rgba(180, 100, 50, 0.05);
}

/* 顶部时间栏 */
.paipan-time {
  padding: 10px 14px;
  background: linear-gradient(135deg, #FFF5F0 0%, #FFE8DC 100%);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #F5E8D8;
  font-size: 12px;
}
.paipan-time .solar {
  font-weight: 600;
  color: #5D4037;
  font-size: 13px;
  font-family: "STKaiti", "KaiTi", serif;
}
.paipan-time .lunar {
  color: #8D6E63;
  font-size: 12px;
}
.paipan-time .jieqi {
  background: #C41E3A;
  color: #fff;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 11px;
  letter-spacing: 1px;
  font-weight: 500;
}

/* 四柱 */
.paipan-sizhu {
  padding: 14px 12px 12px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-bottom: 1px solid #F5E8D8;
  background: #FFFCF8;
}
.sizhu-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.sizhu-cell .ganzhi-pair {
  display: flex;
  align-items: center;
  gap: 1px;
  font-family: "STKaiti", "KaiTi", "STSong", serif;
  font-size: 24px;
  line-height: 1;
  font-weight: 600;
}
.sizhu-cell .gan {
  /* 颜色由 .gan-xxx 提供 */
}
.sizhu-cell .zhi {
  color: #3E2723;
}
.sizhu-cell .label {
  font-size: 10px;
  color: #A1887F;
  letter-spacing: 1px;
  margin-top: 2px;
}

/* 天干五行色 */
.gan-木 { color: #2E7D32; }
.gan-火 { color: #C62828; }
.gan-土 { color: #B8860B; }
.gan-金 { color: #616161; }
.gan-水 { color: #1565C0; }

/* 日空/时空/月建 */
.paipan-xunkong {
  padding: 7px 14px;
  background: #FAF6F0;
  display: flex;
  justify-content: space-around;
  font-size: 11px;
  color: #6D4C41;
  border-bottom: 1px solid #F5E8D8;
}
.paipan-xunkong .xk-item .label {
  color: #A1887F;
  margin-right: 4px;
}
.paipan-xunkong .xk-item .value {
  font-weight: 600;
  color: #C62828;
  font-family: "STKaiti", "KaiTi", serif;
}

/* 神煞 */
.paipan-shensha {
  padding: 10px 14px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px 8px;
  border-bottom: 1px solid #F5E8D8;
  background: #FFF;
}
.shensha-item {
  font-size: 11px;
  display: flex;
  gap: 3px;
  align-items: center;
  white-space: nowrap;
}
.shensha-item .shensha-label {
  color: #999;
}
.shensha-item .shensha-value {
  font-weight: 600;
  font-family: "STKaiti", "KaiTi", serif;
}
.shensha-青龙 { color: #2E7D32; }
.shensha-朱雀 { color: #C62828; }
.shensha-勾陈 { color: #B8860B; }
.shensha-螣蛇 { color: #E65100; }
.shensha-白虎 { color: #757575; }
.shensha-玄武 { color: #1565C0; }

/* 本卦/变卦 信息条 */
.paipan-gua-bar {
  padding: 12px 16px;
  background: #FFF8F0;
  display: grid;
  grid-template-columns: 38px 1fr 96px 18px 96px 1fr;
  align-items: center;
  border-bottom: 1px solid #F5E8D8;
  gap: 4px;
}
.gua-bar-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.gua-bar-item .label {
  font-size: 10px;
  color: #A1887F;
  letter-spacing: 1px;
}
.gua-bar-item .value {
  font-family: "STKaiti", "KaiTi", "STSong", serif;
  font-size: 17px;
  font-weight: 600;
  color: #C41E3A;
  letter-spacing: 1px;
}
.gua-bar-item .sub {
  font-size: 10px;
  color: #8D6E63;
  font-family: "STKaiti", "KaiTi", serif;
}
.gua-bar-arrow {
  font-size: 20px;
  color: #C41E3A;
  font-weight: bold;
}

/* 六爻主体 */
.paipan-hex {
  padding: 10px 12px 12px;
  background: #FFFCF8;
}
.paipan-hex-row {
  display: grid;
  grid-template-columns: 38px 1fr 96px 18px 96px 1fr;
  align-items: center;
  padding: 6px 4px;
  border-bottom: 1px dotted #F0E4D4;
  font-size: 12px;
  gap: 4px;
  min-height: 30px;
}
.paipan-hex-row:last-child { border-bottom: none; }
.paipan-hex-row.is-changing {
  background: linear-gradient(90deg, rgba(196, 30, 58, 0.08) 0%, transparent 80%);
  border-left: 2px solid #C41E3A;
  padding-left: 4px;
}
.paipan-hex-row .col-shensha {
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  padding-left: 2px;
}
.paipan-hex-row .col-fushen {
  font-family: "STKaiti", "KaiTi", serif;
  font-size: 13px;
  color: #4E342E;
  text-align: left;
  padding-left: 4px;
}
.paipan-hex-row .col-yao {
  text-align: center;
  white-space: nowrap;
  position: relative;
}
.paipan-hex-row .yao-wrapper {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  letter-spacing: normal;
}
.paipan-hex-row .yao-symbol {
  display: inline-flex;
  align-items: center;
  vertical-align: middle;
  width: 56px;
  height: 4px;
  border-radius: 2px;
}
.yao-yang { background: #C41E3A; justify-content: center; }
.yao-yin {
  background: transparent;
  justify-content: space-between;
  gap: 8px;
}
.yao-yin .yao-segment {
  flex: 1;
  height: 4px;
  background: #5D4037;
  border-radius: 2px;
}
.yao-changing-mark {
  display: inline-block;
  width: 14px;
  height: 14px;
  line-height: 12px;
  background: #FFEBEE;
  border: 1.5px solid #C62828;
  border-radius: 50%;
  color: #C62828;
  font-size: 10px;
  font-weight: bold;
  text-align: center;
  vertical-align: middle;
}
.marker-shi {
  display: inline-block;
  color: #C41E3A;
  font-weight: bold;
  background: #FFE5E5;
  padding: 1px 4px;
  border-radius: 3px;
  border: 1px solid #F8BBD0;
  vertical-align: middle;
}
.marker-ying {
  display: inline-block;
  color: #1565C0;
  font-weight: bold;
  background: #E3F2FD;
  padding: 1px 4px;
  border-radius: 3px;
  border: 1px solid #90CAF9;
  vertical-align: middle;
}
.paipan-hex-row .col-arrow {
  text-align: center;
  color: #C41E3A;
  font-size: 13px;
  font-weight: bold;
}
.paipan-hex-row .col-bian-info {
  font-family: "STKaiti", "KaiTi", serif;
  font-size: 13px;
  color: #4E342E;
  text-align: right;
  padding-right: 4px;
}
.paipan-hex-row .col-bian-info.text-muted {
  color: #D7CCC8;
}

/* 卦象结果在消息中的样式 */
.divination-result {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border-light);
}

.divination-result .section {
  margin-bottom: 14px;
}

.divination-result .section h4 {
  font-size: 14px;
  color: var(--red);
  margin-bottom: 8px;
  font-weight: 600;
  padding-left: 4px;
  border-left: 3px solid var(--red);
}

.divination-result .section p {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-light);
}

.divination-result .section .gua-highlight {
  display: inline-block;
  background: var(--red-light);
  color: var(--red);
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
  margin: 0 4px;
}

.divination-result blockquote {
  border-left: 3px solid var(--red);
  margin: 8px 0;
  padding: 8px 12px;
  background: #FFF8F8;
  border-radius: 0 6px 6px 0;
  font-family: "STKaiti", "KaiTi", serif;
  color: #8B4513;
  font-size: 13px;
}

.divination-result blockquote cite {
  display: block;
  text-align: right;
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 4px;
  font-style: normal;
}

/* 分享按钮 */
.share-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  padding: 6px 16px;
  background: transparent;
  border: 1px solid var(--red);
  color: var(--red);
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.share-btn:hover {
  background: var(--red-light);
}

/* 排盘信息卡片 */
.pan-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 8px 0 12px;
}

.pan-info-item {
  background: #FAFAFA;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
}

.pan-info-item .label {
  color: var(--text-dim);
  font-size: 11px;
}

.pan-info-item .value {
  color: var(--text);
  font-weight: 500;
  margin-top: 2px;
}

/* 追问对话框 */
.followup-dialog {
  align-self: flex-start;
  width: 100%;
  max-width: 85%;
  margin-top: 8px;
}

.followup-input-wrap {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

.followup-input-wrap textarea {
  flex: 1;
  background: #F5F5F5;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px;
  resize: none;
  outline: none;
  font-family: inherit;
  line-height: 1.5;
  max-height: 80px;
}

.followup-input-wrap textarea:focus {
  border-color: var(--red);
}

.followup-send {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--red);
  color: #fff;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.followup-send:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.followup-cancel {
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}

/* 输入区 */
.chat-input-area {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.chat-input-wrap {
  display: flex;
  gap: 12px;
  align-items: flex-end;
}

.chat-input-wrap textarea {
  flex: 1;
  background: #F5F5F5;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 15px;
  resize: none;
  outline: none;
  font-family: inherit;
  line-height: 1.5;
  max-height: 100px;
}

.chat-input-wrap textarea:focus {
  border-color: var(--red);
}

.btn-send {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--red);
  color: #fff;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all 0.2s;
}

.btn-send:hover {
  background: var(--red-dark);
}

.btn-send:disabled {
  background: #ccc;
  cursor: not-allowed;
}

/* 分享图片隐藏画布 */
.share-canvas {
  position: fixed;
  left: -9999px;
  top: 0;
  width: 750px;
  background: #FFF;
  z-index: -1;
}

.share-canvas-inner {
  padding: 40px;
  background: linear-gradient(180deg, #FFF 0%, #FFF5F5 100%);
  border: 4px solid var(--red);
  border-radius: 16px;
  font-family: "STSong", "SimSun", "Noto Serif SC", serif;
}

.share-header {
  text-align: center;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 2px solid var(--red);
}

.share-header .share-title {
  font-size: 32px;
  color: var(--red);
  letter-spacing: 8px;
  font-weight: bold;
}

.share-header .share-subtitle {
  font-size: 14px;
  color: var(--text-dim);
  margin-top: 8px;
  letter-spacing: 4px;
}

.share-meta {
  display: flex;
  justify-content: space-around;
  margin-bottom: 24px;
  padding: 16px;
  background: var(--red-light);
  border-radius: 8px;
}

.share-meta-item {
  text-align: center;
}

.share-meta-item .meta-label {
  font-size: 12px;
  color: var(--text-dim);
}

.share-meta-item .meta-value {
  font-size: 16px;
  color: var(--red);
  font-weight: 600;
  margin-top: 4px;
}

.share-section {
  margin-bottom: 20px;
}

.share-section h3 {
  font-size: 16px;
  color: var(--red);
  margin-bottom: 8px;
  padding-left: 8px;
  border-left: 4px solid var(--red);
}

.share-section p {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text);
}

.share-footer {
  text-align: center;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 2px;
}

/* 响应式 */
@media (max-width: 768px) {
  .sidebar {
    width: 120px;
    min-width: 80px;
    max-width: 120px;
  }
  .sidebar-logo {
    padding: 20px 12px 16px;
  }
  .sidebar-logo h1 {
    font-size: 16px;
    letter-spacing: 3px;
  }
  .sidebar-logo .subtitle {
    font-size: 10px;
    display: none;
  }
  .nav-item {
    padding: 10px 8px;
    font-size: 13px;
    justify-content: center;
  }
  .nav-icon {
    font-size: 16px;
  }
  .chat-header {
    padding: 12px 16px;
  }
  .chat-messages {
    padding: 16px;
  }
  .chat-input-area {
    padding: 12px 16px;
  }
  .message { max-width: 95%; }
}
</style>
</head>
<body>

<!-- ========== 左侧边栏 ========== -->
<div class="sidebar">
  <div class="sidebar-logo">
    <h1>赛 博 占 卜</h1>
    <div class="subtitle">有书为证的AI六爻</div>
  </div>
  <div class="sidebar-nav">
    <button class="nav-item active" onclick="activateMode('divination')">
      <span class="nav-icon">☰</span>
      <span>六爻占卜</span>
    </button>
  </div>
</div>

<!-- ========== 右侧主区域 ========== -->
<div class="main">
  <!-- 头部按钮 -->
  <div class="chat-header" id="chatHeader">
    <span class="mode-label">六爻占卜</span>
    <button class="btn-action btn-zhan" id="btnZhan" onclick="startNewDivination()">占</button>
    <button class="btn-action btn-zhuiwen" id="btnZhuiwen" disabled onclick="startFollowUp()">追问</button>
  </div>

  <!-- 对话区 -->
  <div class="chat-messages" id="chatMessages">
    <div class="welcome-state" id="welcomeState">
      <div class="welcome-icon">☰</div>
      <h2>六爻排盘</h2>
      <p>点击上方「占」按钮开始新的占卜<br>或「追问」对上次结果进一步探讨</p>
    </div>
  </div>

  <!-- 输入区 -->
  <div class="chat-input-area" id="chatInputArea" style="display:none;">
    <div class="chat-input-wrap">
      <textarea id="userInput" rows="1" placeholder="说说你想问的事..."
        onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
      <button class="btn-send" id="btnSend" onclick="sendDivination()" disabled>→</button>
    </div>
  </div>
</div>

<!-- 分享图片离屏画布 -->
<div class="share-canvas" id="shareCanvas"></div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
const API_BASE = '';
const chatMessages = document.getElementById('chatMessages');
const chatInputArea = document.getElementById('chatInputArea');
const userInput = document.getElementById('userInput');
const btnSend = document.getElementById('btnSend');
const btnZhan = document.getElementById('btnZhan');
const btnZhuiwen = document.getElementById('btnZhuiwen');
const welcomeState = document.getElementById('welcomeState');

let isLoading = false;
let isFollowUpMode = false;
let lastPanData = null;
let lastReading = '';
let lastQuestion = '';
let llmConfigured = true;  // 启动时通过 /api/health 检测

// ========== 五行映射 + 神煞颜色 ==========
const ZHI_WX = {
  子: "水", 亥: "水",
  寅: "木", 卯: "木",
  巳: "火", 午: "火",
  申: "金", 酉: "金",
  辰: "土", 戌: "土", 丑: "土", 未: "土"
};
const GAN_WX = {
  甲: "木", 乙: "木",
  丙: "火", 丁: "火",
  戊: "土", 己: "土",
  庚: "金", 辛: "金",
  壬: "水", 癸: "水"
};
const LIUSHEN_COLOR_CLASS = {
  青龙: "shensha-青龙",
  朱雀: "shensha-朱雀",
  勾陈: "shensha-勾陈",
  螣蛇: "shensha-螣蛇",
  白虎: "shensha-白虎",
  玄武: "shensha-玄武"
};
const SHENSHA_ORDER = ['文昌', '驿马', '将星', '桃花', '天喜', '天医', '谋星', '华盖', '灾煞', '劫煞', '禄神', '阳刃', '贵人'];

// 渲染四柱单个字位
function renderSizhuCell(label, ganzhi) {
  const gan = ganzhi[0];
  const zhi = ganzhi[1];
  const wx = GAN_WX[gan] || '木';
  return `
    <div class="sizhu-cell">
      <div class="ganzhi-pair">
        <span class="gan gan-${wx}">${gan}</span>
        <span class="zhi">${zhi}</span>
      </div>
      <div class="label">${label}</div>
    </div>
  `;
}

// 渲染单个爻画
function makeYaoHtml(isYang, withChangingMark) {
  const inner = isYang ? '' : '<span class="yao-segment"></span><span class="yao-segment"></span>';
  return `<span class="yao-symbol ${isYang ? 'yao-yang' : 'yao-yin'}">${inner}</span>`
    + (withChangingMark ? '<span class="yao-changing-mark" title="动爻">○</span>' : '');
}

// 渲染完整的可视化排盘卡片
function renderPaipan(pan) {
  if (!pan || !pan.lines) return '';
  const sizhu = pan.sizhu;
  const gua = pan.gua;
  const benGua = gua.ben;
  const bianGua = gua.bian;
  const dongYaoList = gua.dong_yao_list || [];

  // 变卦 line map（按 position）
  const bianMap = {};
  if (bianGua && bianGua.lines) {
    bianGua.lines.forEach(l => { bianMap[l.position] = l; });
  }

  // 本卦 6 行，按 position 6→1 排序显示（上爻到初爻）
  const lines = [...pan.lines].sort((a, b) => b.position - a.position);

  // 神煞
  const shenshaHtml = SHENSHA_ORDER
    .filter(k => pan.shensha && pan.shensha[k])
    .map(k => {
      const cls = LIUSHEN_COLOR_CLASS[k] || '';
      return `<div class="shensha-item"><span class="shensha-label">${k}</span><span class="shensha-value ${cls}">${pan.shensha[k]}</span></div>`;
    })
    .join('');

  // 6 行六爻
  const hexHtml = lines.map(line => {
    const pos = line.position;
    const isYang = line.value === 1;
    const isChanging = line.changing;
    const isShi = line.is_shi;
    const isYing = line.is_ying;
    const liushen = line.liushen || '';
    const liushenCls = LIUSHEN_COLOR_CLASS[liushen] || '';
    const liuqin = line.liuqin || '';
    const zhi = line.zhi || '';
    const wx = ZHI_WX[zhi] || '';

    // 本卦爻画
    const benYaoHtml = makeYaoHtml(isYang, isChanging);

    // 世应标记
    let markerHtml = '';
    if (isShi) markerHtml = '<span class="marker-shi" title="世爻">世</span>';
    else if (isYing) markerHtml = '<span class="marker-ying" title="应爻">应</span>';

    // 变卦爻：只有变爻才动、才变化，静爻保持与本卦一致
    const bianLine = bianMap[pos];
    let bianYaoHtml, bianInfoHtml, bianInfoCls = '';
    if (isChanging && bianLine) {
      const bianIsYang = !isYang;
      bianYaoHtml = makeYaoHtml(bianIsYang, false);
      const bianZhi = bianLine.zhi || '';
      const bianWx = ZHI_WX[bianZhi] || '';
      bianInfoHtml = `${bianLine.liuqin || ''}${bianZhi}${bianWx}`;
    } else {
      bianYaoHtml = makeYaoHtml(isYang, false);
      bianInfoHtml = `${liuqin}${zhi}${wx}`;
      bianInfoCls = 'text-muted';
    }

    const rowCls = [
      isChanging ? 'is-changing' : ''
    ].filter(Boolean).join(' ');

    return `
      <div class="paipan-hex-row ${rowCls}">
        <div class="col-shensha ${liushenCls}">${liushen}</div>
        <div class="col-fushen">${liuqin}${zhi}${wx}</div>
        <div class="col-yao"><span class="yao-wrapper">${benYaoHtml}${markerHtml}</span></div>
        <div class="col-arrow">${isChanging ? '→' : ''}</div>
        <div class="col-yao"><span class="yao-wrapper">${bianYaoHtml}</span></div>
        <div class="col-bian-info ${bianInfoCls}">${bianInfoHtml}</div>
      </div>
    `;
  }).join('');

  // 宫位描述（本卦 + 变卦）
  const benSub = `${benGua.palace}宫 · 五行属${benGua.palace_wx}`;
  const dongSub = dongYaoList.length ? `第${dongYaoList.join('、')}爻动` : '无动爻';
  const bianSub = bianGua
    ? dongSub
    : '静卦 · 无动爻';

  return `
    <div class="paipan-card">
      <div class="paipan-time">
        <span class="solar">📅 ${escapeHtml(pan.datetime.solar)}</span>
        <span class="lunar">农历 ${escapeHtml(pan.datetime.lunar)}</span>
        <span class="jieqi">${escapeHtml(pan.jieqi.current)}</span>
      </div>

      <div class="paipan-sizhu">
        ${renderSizhuCell('年柱', sizhu.year)}
        ${renderSizhuCell('月柱', sizhu.month)}
        ${renderSizhuCell('日柱', sizhu.day)}
        ${renderSizhuCell('时柱', sizhu.hour)}
      </div>

      <div class="paipan-xunkong">
        <div class="xk-item"><span class="label">日空</span><span class="value">${escapeHtml(pan.xunkong.day)}</span></div>
        <div class="xk-item"><span class="label">时空</span><span class="value">${escapeHtml(pan.xunkong.hour)}</span></div>
        <div class="xk-item"><span class="label">月建</span><span class="value">${escapeHtml(pan.yuejian)}月</span></div>
      </div>

      <div class="paipan-shensha">
        ${shenshaHtml}
      </div>

      <div class="paipan-gua-bar">
        <div class="gua-bar-item" style="grid-column: 3;">
          <span class="label">本 卦</span>
          <span class="value">${escapeHtml(benGua.name)}</span>
          <span class="sub">${escapeHtml(benSub)}</span>
        </div>
        <div class="gua-bar-arrow" style="grid-column: 4;">→</div>
        <div class="gua-bar-item" style="grid-column: 5;">
          <span class="label">变 卦</span>
          <span class="value">${bianGua ? escapeHtml(bianGua.name) : '静卦'}</span>
          <span class="sub">${escapeHtml(bianSub)}</span>
        </div>
      </div>

      <div class="paipan-hex">
        ${hexHtml}
      </div>
    </div>
  `;
}

// ========== 模式切换 ==========
function activateMode(mode) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.nav-item[onclick*="${mode}"]`)?.classList.add('active');
}

// ========== 新占卜 ==========
function startNewDivination() {
  if (!llmConfigured) {
    addSystemMsg('⚠️ AI 模型密钥未配置，无法进行占卜。\n请管理员设置 DEEPSEEK_API_KEY 环境变量并重启服务。');
    return;
  }
  isFollowUpMode = false;
  hideWelcome();
  chatInputArea.style.display = 'block';
  userInput.placeholder = '说说你想问的事...';
  userInput.value = '';
  userInput.focus();
  btnSend.disabled = true;
  btnZhuiwen.disabled = true;
}

// ========== 追问 ==========
function startFollowUp() {
  if (!lastPanData) {
    addSystemMsg('请先完成一次占卜后再追问');
    return;
  }
  isFollowUpMode = true;
  hideWelcome();
  chatInputArea.style.display = 'block';
  userInput.placeholder = '针对上次占卜结果，想问什么？';
  userInput.value = '';
  userInput.focus();
  btnSend.disabled = true;
}

// ========== 发送 ==========
async function sendDivination() {
  const text = userInput.value.trim();
  if (!text || isLoading) return;
  if (!llmConfigured && !isFollowUpMode) {
    addSystemMsg('⚠️ AI 模型密钥未配置，无法进行占卜。');
    return;
  }

  // 用户消息
  const userMsg = isFollowUpMode
    ? `追问：${text}`
    : `占：${text}`;
  addUserMessage(userMsg);

  userInput.value = '';
  userInput.style.height = 'auto';
  btnSend.disabled = true;
  btnZhan.disabled = true;
  isLoading = true;

  // 加载动画
  const loadingEl = addLoadingMessage('正在进行解卦，请稍等...');

  try {
    let result;
    if (isFollowUpMode) {
      // 追问模式
      result = await fetchFollowUp(text);
      lastReading = result.reading;
    } else {
      // 新占卜
      result = await fetchDivination(text);
      lastPanData = result.pan;
      lastReading = result.reading;
      lastQuestion = text;
      btnZhuiwen.disabled = false;
    }

    removeLoading(loadingEl);
    renderBotResponse(result, isFollowUpMode ? '追问回答' : '占卜结果');

    // 重置状态
    chatInputArea.style.display = 'none';
    btnZhan.disabled = false;

  } catch (err) {
    removeLoading(loadingEl);
    addSystemMsg(`连接失败: ${err.message}`);
    btnZhan.disabled = false;
  }

  isLoading = false;
}

// ========== API 调用 ==========
async function fetchDivination(question) {
  const resp = await fetch(`${API_BASE}/api/divination`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question }),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ detail: resp.statusText }));
    throw new Error(err.detail || `服务器错误: ${resp.status}`);
  }
  return resp.json();
}

async function fetchFollowUp(question) {
  const resp = await fetch(`${API_BASE}/api/follow-up`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      question: question,
      original_question: lastQuestion,
      original_reading: lastReading,
      pan: lastPanData,
    }),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ detail: resp.statusText }));
    throw new Error(err.detail || `服务器错误: ${resp.status}`);
  }
  return resp.json();
}

// ========== 消息渲染 ==========
function addUserMessage(text) {
  hideWelcome();
  const el = document.createElement('div');
  el.className = 'message user';
  el.innerHTML = `
    <div class="msg-bubble">${escapeHtml(text)}</div>
    <div class="msg-time">${getTime()}</div>
  `;
  chatMessages.appendChild(el);
  scrollToBottom();
}

function addSystemMsg(text) {
  hideWelcome();
  const el = document.createElement('div');
  el.className = 'message bot';
  el.innerHTML = `
    <div class="msg-bubble" style="color:var(--text-dim);font-size:13px;">${escapeHtml(text).replace(/\n/g, '<br>')}</div>
  `;
  chatMessages.appendChild(el);
  scrollToBottom();
}

function addLoadingMessage(text) {
  hideWelcome();
  const el = document.createElement('div');
  el.className = 'loading-msg';
  el.id = 'loading-msg';
  el.innerHTML = `
    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
    <span class="loading-text">${text}</span>
  `;
  chatMessages.appendChild(el);
  scrollToBottom();
  return el;
}

function removeLoading(el) {
  if (el && el.parentNode) el.remove();
}

function renderBotResponse(data, label) {
  hideWelcome();
  const el = document.createElement('div');
  el.className = 'message bot';

  let html = `<div class="msg-bubble">`;

  if (!isFollowUpMode && data.pan) {
    // 完整占卜结果
    const pan = data.pan;
    const benGua = pan.gua.ben.name;
    const bianGua = pan.gua.bian ? pan.gua.bian.name : '静卦';

    html += `
      <div style="font-weight:600;color:var(--red);font-size:15px;margin-bottom:10px;">🔮 ${label}</div>
      ${renderPaipan(pan)}
      <div class="divination-result">
        ${formatReading(data.reading)}
      </div>
    `;

    // 分享按钮（仅完整占卜结果）
    html += `
      <button class="share-btn" onclick="shareDivination('${escapeAttr(data.question)}', '${escapeAttr(benGua)}', '${escapeAttr(bianGua)}', '${escapeAttr(pan.datetime.solar)}', '${escapeAttr(pan.datetime.lunar)}')">
        📤 分享此卦
      </button>
    `;
  } else {
    // 追问回答
    html += `
      <div style="font-weight:600;color:var(--red);font-size:15px;margin-bottom:10px;">💬 ${label}</div>
      <div class="divination-result">
        ${formatReading(data.reading)}
      </div>
    `;
  }

  html += `</div><div class="msg-time">${getTime()}</div>`;
  el.innerHTML = html;
  chatMessages.appendChild(el);
  scrollToBottom();
}

function stripPaiPanTemplate(text) {
  // 过滤 AI 输出中可能混入的排盘模板（前端已用可视化卡片渲染排盘，不需要文本形式的排盘）

  // 1. 去掉 ``` 包裹的排盘代码块（含制表符或爻位）
  text = text.replace(/```[\s\S]*?```/g, (match) => {
    if (/[┌└├─│┐┘┤]/.test(match) || /上爻|五爻|四爻|三爻|二爻|初爻/.test(match)) {
      return '';
    }
    return match;
  });

  // 2. 从第一个【章节标题开始保留（排盘模板不会以【开头）
  const firstHeader = text.search(/【/);
  if (firstHeader > 0) {
    text = text.substring(firstHeader);
  }

  // 3. 删除残留的制表符行
  text = text.split('\n').filter(line => {
    return !/[┌└├─│┐┘┤]/.test(line);
  }).join('\n');

  // 4. 合并多余空行
  text = text.replace(/\n{3,}/g, '\n\n');

  return text.trim();
}

function formatReading(text) {
  // 过滤掉 AI 可能混入的排盘模板文本
  text = stripPaiPanTemplate(text);
  // 先转义已有 HTML，防止 LLM 输出中被注入恶意代码
  text = escapeHtml(text);
  // 古籍引用：原文格式处理（使用转义后的字符）
  text = text.replace(/「([^」]+)」[—–-]+[《]([^》]+)[》]/g,
    '<blockquote>「$1」<cite>——《$2》</cite></blockquote>');
  // 章节标题
  text = text.replace(/【(.+?)】/g, '<h4>$1</h4>');
  // 卦名高亮
  text = text.replace(/本卦[：:]\s*(.+?)(?=[，,\n<]|$)/g, '本卦：<span class="gua-highlight">$1</span>');
  // 换行
  text = text.replace(/\n/g, '<br>');
  // strong（在转义后的 &lt; 和 &gt; 基础上就已不存在 **，需在转义前处理）
  // 注意：escapeHtml 已经把 < 转成了 &lt;，但 ** 不受影响
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return text;
}

// ========== 分享此卦 ==========
async function shareDivination(question, benGua, bianGua, solar, lunar) {
  // 提取分析内容
  const reading = extractShareContent(lastReading);

  const canvas = document.getElementById('shareCanvas');
  canvas.innerHTML = `
    <div class="share-canvas-inner" id="shareContent">
      <div class="share-header">
        <div class="share-title">赛 博 占 卜</div>
        <div class="share-subtitle">六爻排盘 · 分享此卦</div>
      </div>
      <div class="share-meta">
        <div class="share-meta-item">
          <div class="meta-label">公历</div>
          <div class="meta-value">${escapeHtml(solar)}</div>
        </div>
        <div class="share-meta-item">
          <div class="meta-label">农历</div>
          <div class="meta-value">${escapeHtml(lunar)}</div>
        </div>
        <div class="share-meta-item">
          <div class="meta-label">本卦 → 变卦</div>
          <div class="meta-value">${escapeHtml(benGua)} → ${escapeHtml(bianGua)}</div>
        </div>
      </div>
      ${lastPanData ? renderPaipan(lastPanData) : ''}
      <div class="share-section">
        <h3>所占之事</h3>
        <p>${escapeHtml(question)}</p>
      </div>
      <div class="share-section">
        <h3>大白话</h3>
        <div style="font-size:13px;line-height:2;color:#444;">${escapeHtml(reading).replace(/\n/g, '<br>')}</div>
      </div>
      <div class="share-footer">
        以上内容由AI生成 · 仅供娱乐参考
      </div>
    </div>
  `;

  // 等待渲染
  await new Promise(r => setTimeout(r, 300));

  try {
    const contentEl = document.getElementById('shareContent');
    const canvasImg = await html2canvas(contentEl, {
      backgroundColor: '#FFFFFF',
      scale: 2,
      useCORS: true,
    });

    // 下载
    const link = document.createElement('a');
    link.download = `赛博占卜_${solar.replace(/-/g,'')}_${benGua}.png`;
    link.href = canvasImg.toDataURL('image/png');
    link.click();

    // 清理
    canvas.innerHTML = '';
  } catch (e) {
    console.error('生成分享图片失败:', e);
    addSystemMsg('分享图片生成失败，请重试');
    canvas.innerHTML = '';
  }
}

function extractShareContent(reading) {
  // 只提取【大白话】部分
  let content = reading;

  const keyword = '【大白话】';
  const idx = content.indexOf(keyword);
  if (idx >= 0) {
    // 去掉标题本身，取后面的内容
    let extracted = content.substring(idx + keyword.length).trim();
    // 清理末尾标记
    extracted = extracted.replace(/---.*$/s, '');
    return extracted;
  }
  // 如果找不到大白话，返回原文前800字
  return reading.substring(0, 800);
}

// ========== 工具函数 ==========
function hideWelcome() {
  if (welcomeState) welcomeState.style.display = 'none';
}

function getTime() {
  const now = new Date();
  return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendDivination();
  }
}

function scrollToBottom() {
  setTimeout(() => {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }, 100);
}

// ========== 输入监听 ==========
userInput.addEventListener('input', () => {
  btnSend.disabled = !userInput.value.trim() || isLoading;
});

// ========== 初始化 ==========
async function init() {
  // 检测后端 LLM 是否已配置
  try {
    const resp = await fetch(`${API_BASE}/api/health`);
    const health = await resp.json();
    llmConfigured = health.llm_configured;
    if (!llmConfigured) {
      addSystemMsg('⚠️ 后端未配置 AI 模型密钥（DEEPSEEK_API_KEY），占卜功能暂时不可用。\n请管理员设置环境变量后重启服务。');
      btnZhan.disabled = true;
    }
  } catch (e) {
    // 后端未启动，忽略（后续 API 调用会报错）
  }
  userInput.focus();
}

function showKeyWarning() {
  if (!llmConfigured) {
    addSystemMsg('⚠️ AI 模型未配置，无法占卜。请设置 DEEPSEEK_API_KEY 环境变量后重启服务。');
    return true;
  }
  return false;
}

init();
</script>
