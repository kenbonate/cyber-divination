<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛博占卜 - 六爻排盘</title>
<style>
:root {
  --red: #C41E3A;
  --red-dark: #A0182F;
  --red-light: #FFF0F3;
  --bg: #FFFFFF;
  --bg-sidebar: #FAFAFA;
  --text: #333333;
  --text-dim: #999999;
  --text-light: #666666;
  --border: #E8E8E8;
  --border-light: #F0F0F0;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* ========== 左侧边栏 ========== */
.sidebar {
  width: 25%;
  min-width: 220px;
  max-width: 300px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-logo {
  padding: 28px 24px 20px;
  border-bottom: 1px solid var(--border);
}

.sidebar-logo h1 {
  font-family: "STSong", "SimSun", "Noto Serif SC", serif;
  font-size: 22px;
  letter-spacing: 6px;
  color: var(--red);
  font-weight: normal;
  margin-bottom: 4px;
}

.sidebar-logo .subtitle {
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 2px;
}

.sidebar-nav {
  padding: 16px 12px;
  flex: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 16px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.nav-item:hover {
  background: var(--red-light);
  color: var(--red);
}

.nav-item.active {
  background: var(--red);
  color: #fff;
  font-weight: 500;
}

.nav-icon {
  font-size: 20px;
  width: 28px;
  text-align: center;
}

/* ========== 右侧主区域 ========== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* 头部按钮栏 */
.chat-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  align-items: center;
  flex-shrink: 0;
  min-height: 60px;
}

.chat-header .mode-label {
  font-size: 14px;
  color: var(--text-dim);
  margin-right: auto;
}

.btn-action {
  padding: 8px 24px;
  border: 2px solid var(--red);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  letter-spacing: 2px;
}

.btn-zhan {
  background: var(--red);
  color: #fff;
}

.btn-zhan:hover {
  background: var(--red-dark);
}

.btn-zhan:disabled {
  background: #ccc;
  border-color: #ccc;
  cursor: not-allowed;
}

.btn-zhuiwen {
  background: transparent;
  color: var(--red);
}

.btn-zhuiwen:hover {
  background: var(--red-light);
}

.btn-zhuiwen:disabled {
  color: #ccc;
  border-color: #ddd;
  cursor: not-allowed;
}

/* 对话消息区 */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* 欢迎状态 */
.welcome-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  gap: 16px;
  padding: 40px;
}

.welcome-state .welcome-icon {
  font-size: 48px;
  opacity: 0.6;
}

.welcome-state h2 {
  font-family: "STSong", "SimSun", serif;
  font-size: 22px;
  color: var(--text-light);
  letter-spacing: 4px;
  font-weight: normal;
}

.welcome-state p {
  font-size: 14px;
  text-align: center;
  line-height: 1.6;
}

/* 消息气泡 */
.message {
  display: flex;
  flex-direction: column;
  max-width: 85%;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user {
  align-self: flex-end;
}

.message.user .msg-bubble {
  background: var(--red);
  color: #fff;
  border-radius: 16px 16px 4px 16px;
  padding: 12px 18px;
  font-size: 15px;
  line-height: 1.6;
}

.message.bot {
  align-self: flex-start;
}

.message.bot .msg-bubble {
  background: #F5F5F5;
  color: var(--text);
  border-radius: 16px 16px 16px 4px;
  padding: 16px 20px;
  font-size: 14px;
  line-height: 1.8;
  box-shadow: var(--shadow);
  width: 100%;
}

.msg-time {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
  text-align: center;
}

/* 加载动画 */
.loading-msg {
  align-self: flex-start;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  background: #F5F5F5;
  border-radius: 16px;
  box-shadow: var(--shadow);
  animation: fadeIn 0.3s ease;
}

.loading-dots {
  display: flex;
  gap: 4px;
}

.loading-dots span {
  width: 8px;
  height: 8px;
  background: var(--red);
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out both;
}

.loading-dots span:nth-child(1) { animation-delay: -0.32s; }
.loading-dots span:nth-child(2) { animation-delay: -0.16s; }
.loading-dots span:nth-child(3) { animation-delay: 0s; }

@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

.loading-text {
  font-size: 14px;
  color: var(--text-dim);
}

/* 卦象结果在消息中的样式 */
.divination-result {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border-light);
}

.divination-result .section {
  margin-bottom: 14px;
}

.divination-result .section h4 {
  font-size: 14px;
  color: var(--red);
  margin-bottom: 8px;
  font-weight: 600;
  padding-left: 4px;
  border-left: 3px solid var(--red);
}

.divination-result .section p {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-light);
}

.divination-result .section .gua-highlight {
  display: inline-block;
  background: var(--red-light);
  color: var(--red);
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
  margin: 0 4px;
}

.divination-result blockquote {
  border-left: 3px solid var(--red);
  margin: 8px 0;
  padding: 8px 12px;
  background: #FFF8F8;
  border-radius: 0 6px 6px 0;
  font-family: "STKaiti", "KaiTi", serif;
  color: #8B4513;
  font-size: 13px;
}

.divination-result blockquote cite {
  display: block;
  text-align: right;
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 4px;
  font-style: normal;
}

/* 分享按钮 */
.share-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  padding: 6px 16px;
  background: transparent;
  border: 1px solid var(--red);
  color: var(--red);
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.share-btn:hover {
  background: var(--red-light);
}

/* 排盘信息卡片 */
.pan-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 8px 0 12px;
}

.pan-info-item {
  background: #FAFAFA;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
}

.pan-info-item .label {
  color: var(--text-dim);
  font-size: 11px;
}

.pan-info-item .value {
  color: var(--text);
  font-weight: 500;
  margin-top: 2px;
}

/* 追问对话框 */
.followup-dialog {
  align-self: flex-start;
  width: 100%;
  max-width: 85%;
  margin-top: 8px;
}

.followup-input-wrap {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

.followup-input-wrap textarea {
  flex: 1;
  background: #F5F5F5;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px;
  resize: none;
  outline: none;
  font-family: inherit;
  line-height: 1.5;
  max-height: 80px;
}

.followup-input-wrap textarea:focus {
  border-color: var(--red);
}

.followup-send {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--red);
  color: #fff;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.followup-send:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.followup-cancel {
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}

/* 输入区 */
.chat-input-area {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.chat-input-wrap {
  display: flex;
  gap: 12px;
  align-items: flex-end;
}

.chat-input-wrap textarea {
  flex: 1;
  background: #F5F5F5;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 15px;
  resize: none;
  outline: none;
  font-family: inherit;
  line-height: 1.5;
  max-height: 100px;
}

.chat-input-wrap textarea:focus {
  border-color: var(--red);
}

.btn-send {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--red);
  color: #fff;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all 0.2s;
}

.btn-send:hover {
  background: var(--red-dark);
}

.btn-send:disabled {
  background: #ccc;
  cursor: not-allowed;
}

/* 分享图片隐藏画布 */
.share-canvas {
  position: fixed;
  left: -9999px;
  top: 0;
  width: 750px;
  background: #FFF;
  z-index: -1;
}

.share-canvas-inner {
  padding: 40px;
  background: linear-gradient(180deg, #FFF 0%, #FFF5F5 100%);
  border: 4px solid var(--red);
  border-radius: 16px;
  font-family: "STSong", "SimSun", "Noto Serif SC", serif;
}

.share-header {
  text-align: center;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 2px solid var(--red);
}

.share-header .share-title {
  font-size: 32px;
  color: var(--red);
  letter-spacing: 8px;
  font-weight: bold;
}

.share-header .share-subtitle {
  font-size: 14px;
  color: var(--text-dim);
  margin-top: 8px;
  letter-spacing: 4px;
}

.share-meta {
  display: flex;
  justify-content: space-around;
  margin-bottom: 24px;
  padding: 16px;
  background: var(--red-light);
  border-radius: 8px;
}

.share-meta-item {
  text-align: center;
}

.share-meta-item .meta-label {
  font-size: 12px;
  color: var(--text-dim);
}

.share-meta-item .meta-value {
  font-size: 16px;
  color: var(--red);
  font-weight: 600;
  margin-top: 4px;
}

.share-section {
  margin-bottom: 20px;
}

.share-section h3 {
  font-size: 16px;
  color: var(--red);
  margin-bottom: 8px;
  padding-left: 8px;
  border-left: 4px solid var(--red);
}

.share-section p {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text);
}

.share-footer {
  text-align: center;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 2px;
}

/* 响应式 */
@media (max-width: 768px) {
  .sidebar {
    width: 120px;
    min-width: 80px;
    max-width: 120px;
  }
  .sidebar-logo {
    padding: 20px 12px 16px;
  }
  .sidebar-logo h1 {
    font-size: 16px;
    letter-spacing: 3px;
  }
  .sidebar-logo .subtitle {
    font-size: 10px;
    display: none;
  }
  .nav-item {
    padding: 10px 8px;
    font-size: 13px;
    justify-content: center;
  }
  .nav-icon {
    font-size: 16px;
  }
  .chat-header {
    padding: 12px 16px;
  }
  .chat-messages {
    padding: 16px;
  }
  .chat-input-area {
    padding: 12px 16px;
  }
  .message { max-width: 95%; }
}
</style>
</head>
<body>

<!-- ========== 左侧边栏 ========== -->
<div class="sidebar">
  <div class="sidebar-logo">
    <h1>赛 博 占 卜</h1>
    <div class="subtitle">有书为证的AI六爻</div>
  </div>
  <div class="sidebar-nav">
    <button class="nav-item active" onclick="activateMode('divination')">
      <span class="nav-icon">☰</span>
      <span>六爻占卜</span>
    </button>
  </div>
</div>

<!-- ========== 右侧主区域 ========== -->
<div class="main">
  <!-- 头部按钮 -->
  <div class="chat-header" id="chatHeader">
    <span class="mode-label">六爻占卜</span>
    <button class="btn-action btn-zhan" id="btnZhan" onclick="startNewDivination()">占</button>
    <button class="btn-action btn-zhuiwen" id="btnZhuiwen" disabled onclick="startFollowUp()">追问</button>
  </div>

  <!-- 对话区 -->
  <div class="chat-messages" id="chatMessages">
    <div class="welcome-state" id="welcomeState">
      <div class="welcome-icon">☰</div>
      <h2>六爻排盘</h2>
      <p>点击上方「占」按钮开始新的占卜<br>或「追问」对上次结果进一步探讨</p>
    </div>
  </div>

  <!-- 输入区 -->
  <div class="chat-input-area" id="chatInputArea" style="display:none;">
    <div class="chat-input-wrap">
      <textarea id="userInput" rows="1" placeholder="说说你想问的事..."
        onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
      <button class="btn-send" id="btnSend" onclick="sendDivination()" disabled>→</button>
    </div>
  </div>
</div>

<!-- 分享图片离屏画布 -->
<div class="share-canvas" id="shareCanvas"></div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
const API_BASE = '';
const chatMessages = document.getElementById('chatMessages');
const chatInputArea = document.getElementById('chatInputArea');
const userInput = document.getElementById('userInput');
const btnSend = document.getElementById('btnSend');
const btnZhan = document.getElementById('btnZhan');
const btnZhuiwen = document.getElementById('btnZhuiwen');
const welcomeState = document.getElementById('welcomeState');

let isLoading = false;
let isFollowUpMode = false;
let lastPanData = null;
let lastReading = '';
let lastQuestion = '';

// ========== 模式切换 ==========
function activateMode(mode) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.nav-item[onclick*="${mode}"]`)?.classList.add('active');
}

// ========== 新占卜 ==========
function startNewDivination() {
  isFollowUpMode = false;
  hideWelcome();
  chatInputArea.style.display = 'block';
  userInput.placeholder = '说说你想问的事...';
  userInput.value = '';
  userInput.focus();
  btnSend.disabled = true;
  btnZhuiwen.disabled = true;
}

// ========== 追问 ==========
function startFollowUp() {
  if (!lastPanData) {
    addSystemMsg('请先完成一次占卜后再追问');
    return;
  }
  isFollowUpMode = true;
  hideWelcome();
  chatInputArea.style.display = 'block';
  userInput.placeholder = '针对上次占卜结果，想问什么？';
  userInput.value = '';
  userInput.focus();
  btnSend.disabled = true;
  btnZhan.disabled = true;
}

// ========== 发送 ==========
async function sendDivination() {
  const text = userInput.value.trim();
  if (!text || isLoading) return;

  // 用户消息
  const userMsg = isFollowUpMode
    ? `追问：${text}`
    : `占：${text}`;
  addUserMessage(userMsg);

  userInput.value = '';
  userInput.style.height = 'auto';
  btnSend.disabled = true;
  btnZhan.disabled = true;
  isLoading = true;

  // 加载动画
  const loadingEl = addLoadingMessage('正在进行解卦，请稍等...');

  try {
    let result;
    if (isFollowUpMode) {
      // 追问模式
      result = await fetchFollowUp(text);
      lastReading = result.reading;
    } else {
      // 新占卜
      result = await fetchDivination(text);
      lastPanData = result.pan;
      lastReading = result.reading;
      lastQuestion = text;
      btnZhuiwen.disabled = false;
    }

    removeLoading(loadingEl);
    renderBotResponse(result, isFollowUpMode ? '追问回答' : '占卜结果');

    // 重置状态
    chatInputArea.style.display = 'none';
    btnZhan.disabled = false;

  } catch (err) {
    removeLoading(loadingEl);
    addSystemMsg(`连接失败: ${err.message}`);
    btnZhan.disabled = false;
  }

  isLoading = false;
}

// ========== API 调用 ==========
async function fetchDivination(question) {
  const resp = await fetch(`${API_BASE}/api/divination`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question }),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ detail: resp.statusText }));
    throw new Error(err.detail || `服务器错误: ${resp.status}`);
  }
  return resp.json();
}

async function fetchFollowUp(question) {
  const resp = await fetch(`${API_BASE}/api/follow-up`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      question: question,
      original_question: lastQuestion,
      original_reading: lastReading,
      pan: lastPanData,
    }),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ detail: resp.statusText }));
    throw new Error(err.detail || `服务器错误: ${resp.status}`);
  }
  return resp.json();
}

// ========== 消息渲染 ==========
function addUserMessage(text) {
  hideWelcome();
  const el = document.createElement('div');
  el.className = 'message user';
  el.innerHTML = `
    <div class="msg-bubble">${escapeHtml(text)}</div>
    <div class="msg-time">${getTime()}</div>
  `;
  chatMessages.appendChild(el);
  scrollToBottom();
}

function addSystemMsg(text) {
  hideWelcome();
  const el = document.createElement('div');
  el.className = 'message bot';
  el.innerHTML = `
    <div class="msg-bubble" style="color:var(--text-dim);font-size:13px;">${escapeHtml(text)}</div>
  `;
  chatMessages.appendChild(el);
  scrollToBottom();
}

function addLoadingMessage(text) {
  hideWelcome();
  const el = document.createElement('div');
  el.className = 'loading-msg';
  el.id = 'loading-msg';
  el.innerHTML = `
    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
    <span class="loading-text">${text}</span>
  `;
  chatMessages.appendChild(el);
  scrollToBottom();
  return el;
}

function removeLoading(el) {
  if (el && el.parentNode) el.remove();
}

function renderBotResponse(data, label) {
  hideWelcome();
  const el = document.createElement('div');
  el.className = 'message bot';

  let html = `<div class="msg-bubble">`;

  if (!isFollowUpMode && data.pan) {
    // 完整占卜结果
    const pan = data.pan;
    const benGua = pan.gua.ben.name;
    const bianGua = pan.gua.bian ? pan.gua.bian.name : '静卦';
    const dongYao = pan.gua.dong_yao;
    const sizhu = pan.sizhu;

    html += `
      <div style="font-weight:600;color:var(--red);font-size:15px;margin-bottom:10px;">🔮 ${label}</div>
      <div class="pan-info">
        <div class="pan-info-item">
          <div class="label">起卦时间</div>
          <div class="value">${pan.datetime.solar}</div>
        </div>
        <div class="pan-info-item">
          <div class="label">农历</div>
          <div class="value">${pan.datetime.lunar}</div>
        </div>
        <div class="pan-info-item">
          <div class="label">本卦</div>
          <div class="value" style="color:var(--red);font-family:STSong,SimSun,serif;font-size:16px;">${benGua}</div>
        </div>
        <div class="pan-info-item">
          <div class="label">变卦/动爻</div>
          <div class="value">${bianGua}${dongYao ? ' · 第'+dongYao+'爻动' : ''}</div>
        </div>
      </div>
      <div class="divination-result">
        ${formatReading(data.reading)}
      </div>
    `;

    // 分享按钮（仅完整占卜结果）
    html += `
      <button class="share-btn" onclick="shareDivination('${escapeAttr(data.question)}', '${escapeAttr(benGua)}', '${escapeAttr(bianGua)}', '${escapeAttr(pan.datetime.solar)}', '${escapeAttr(pan.datetime.lunar)}')">
        📤 分享此卦
      </button>
    `;
  } else {
    // 追问回答
    html += `
      <div style="font-weight:600;color:var(--red);font-size:15px;margin-bottom:10px;">💬 ${label}</div>
      <div class="divination-result">
        ${formatReading(data.reading)}
      </div>
    `;
  }

  html += `</div><div class="msg-time">${getTime()}</div>`;
  el.innerHTML = html;
  chatMessages.appendChild(el);
  scrollToBottom();
}

function formatReading(text) {
  // 古籍引用：原文格式处理
  text = text.replace(/「([^」]+)」[—–-]+[《]([^》]+)[》]/g,
    '<blockquote>「$1」<cite>——《$2》</cite></blockquote>');
  // 章节标题
  text = text.replace(/【(.+?)】/g, '<h4>$1</h4>');
  // 卦名高亮
  text = text.replace(/本卦[：:]\s*(.+?)(?=[，,\n<]|$)/g, '本卦：<span class="gua-highlight">$1</span>');
  // 换行
  text = text.replace(/\n/g, '<br>');
  // strong
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return text;
}

// ========== 分享此卦 ==========
async function shareDivination(question, benGua, bianGua, solar, lunar) {
  // 提取分析内容
  const reading = extractShareContent(lastReading);

  const canvas = document.getElementById('shareCanvas');
  canvas.innerHTML = `
    <div class="share-canvas-inner" id="shareContent">
      <div class="share-header">
        <div class="share-title">赛 博 占 卜</div>
        <div class="share-subtitle">六爻排盘 · 分享此卦</div>
      </div>
      <div class="share-meta">
        <div class="share-meta-item">
          <div class="meta-label">公历</div>
          <div class="meta-value">${solar}</div>
        </div>
        <div class="share-meta-item">
          <div class="meta-label">农历</div>
          <div class="meta-value">${lunar}</div>
        </div>
        <div class="share-meta-item">
          <div class="meta-label">本卦 → 变卦</div>
          <div class="meta-value">${benGua} → ${bianGua}</div>
        </div>
      </div>
      <div class="share-section">
        <h3>所占之事</h3>
        <p>${question}</p>
      </div>
      <div class="share-section">
        <h3>占卜分析</h3>
        <div style="font-size:13px;line-height:2;color:#444;">${reading}</div>
      </div>
      <div class="share-footer">
        以上内容由AI生成 · 仅供娱乐参考
      </div>
    </div>
  `;

  // 等待渲染
  await new Promise(r => setTimeout(r, 300));

  try {
    const contentEl = document.getElementById('shareContent');
    const canvasImg = await html2canvas(contentEl, {
      backgroundColor: '#FFFFFF',
      scale: 2,
      useCORS: true,
    });

    // 下载
    const link = document.createElement('a');
    link.download = `赛博占卜_${solar.replace(/-/g,'')}_${benGua}.png`;
    link.href = canvasImg.toDataURL('image/png');
    link.click();

    // 清理
    canvas.innerHTML = '';
  } catch (e) {
    console.error('生成分享图片失败:', e);
    addSystemMsg('分享图片生成失败，请重试');
    canvas.innerHTML = '';
  }
}

function extractShareContent(reading) {
  // 提取核心分析内容，去掉排盘表格
  let content = reading;

  // 移除纯文本排盘部分
  const sections = ['【卦象总览】', '【核心判断】', '【古籍依据】', '【知识库参照】', '【详细分析】', '【给你的建议】', '【大白话】'];
  let extracted = '';
  for (const s of sections) {
    const idx = content.indexOf(s);
    if (idx >= 0) {
      let end = content.length;
      for (const ns of sections) {
        const nidx = content.indexOf(ns, idx + s.length);
        if (nidx > 0 && nidx < end) end = nidx;
      }
      extracted += content.substring(idx, end).trim() + '<br><br>';
    }
  }

  // 清理末尾标记
  extracted = extracted.replace(/---.*$/s, '');
  return extracted || reading.substring(0, 800);
}

// ========== 工具函数 ==========
function hideWelcome() {
  if (welcomeState) welcomeState.style.display = 'none';
}

function getTime() {
  const now = new Date();
  return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendDivination();
  }
}

function scrollToBottom() {
  setTimeout(() => {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }, 100);
}

// ========== 输入监听 ==========
userInput.addEventListener('input', () => {
  btnSend.disabled = !userInput.value.trim() || isLoading;
});

// ========== 初始化 ==========
userInput.focus();
</script>
